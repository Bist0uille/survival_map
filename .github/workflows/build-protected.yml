# Génère protected.pmtiles = aires protégées de FR + ES + IT (parcs nationaux,
# réserves naturelles, aires protégées) où le bivouac est souvent interdit ou
# réglementé. Couche informative. Hébergée sur Cloudflare R2 (comme paths).
name: Construire PMTiles Aires protégées (R2)

on:
  schedule:
    - cron: '0 6 1 * *' # 1er du mois 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Installer osmium + tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool build-essential libsqlite3-dev zlib1g-dev
          git init /tmp/tippecanoe
          git -C /tmp/tippecanoe remote add origin https://github.com/felt/tippecanoe.git
          git -C /tmp/tippecanoe fetch --depth 1 origin 4f2621186acfec33b63ddf636f665623c0fef2dd
          git -C /tmp/tippecanoe checkout --detach FETCH_HEAD
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Télécharger + filtrer + fusionner FR+ES+IT
        run: |
          set -e
          # Relations + ways : parcs nationaux, aires protégées, réserves.
          bash scripts/fetch-merge.sh /tmp/protected.osm.pbf "france spain italy" \
            wr/boundary=national_park,protected_area \
            wr/leisure=nature_reserve
          osmium export /tmp/protected.osm.pbf -f geojsonseq \
            --geometry-types=polygon -o /tmp/protected.geojsonseq --overwrite
          node scripts/osm-protected-to-input.mjs < /tmp/protected.geojsonseq > /tmp/protected-input.geojsonseq
          wc -l /tmp/protected-input.geojsonseq

      - name: Construire protected.pmtiles
        run: |
          set -e
          tippecanoe -o /tmp/protected.pmtiles -l protected \
            -Z5 -z12 --drop-densest-as-needed --coalesce-densest-as-needed \
            --simplification=10 --maximum-tile-bytes=500000 --force \
            /tmp/protected-input.geojsonseq
          echo "=== TAILLE protected.pmtiles ==="
          ls -lh /tmp/protected.pmtiles

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tiles
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/protected.pmtiles

  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tiles
          path: /tmp
      - name: Envoyer sur Cloudflare R2 (si secrets présents)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "Secrets R2 absents → upload sauté (mesure de taille seule)."
            exit 0
          fi
          aws --version # AWS CLI supplied by the GitHub-hosted runner
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          aws s3 cp /tmp/protected.pmtiles "s3://$R2_BUCKET/protected.pmtiles" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/octet-stream
          echo "✅ protected.pmtiles envoyé sur R2."
