# À copier dans .github/workflows/build-geotrek.yml
# Récupère les fiches rando Geotrek (API v2) et construit public/treks.pmtiles.
# Léger : pas de téléchargement OSM France, juste des appels API + tippecanoe.
name: Construire PMTiles Geotrek

on:
  schedule:
    - cron: '0 4 * * 1' # chaque lundi 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Installer tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git init /tmp/tippecanoe
          git -C /tmp/tippecanoe remote add origin https://github.com/felt/tippecanoe.git
          git -C /tmp/tippecanoe fetch --depth 1 origin 4f2621186acfec33b63ddf636f665623c0fef2dd
          git -C /tmp/tippecanoe checkout --detach FETCH_HEAD
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Récupérer les treks Geotrek
        run: node scripts/fetch-geotrek.mjs > /tmp/treks.geojsonseq

      - name: Construire treks.pmtiles
        run: |
          mkdir -p public
          tippecanoe -o public/treks.pmtiles -l treks \
            -Z6 -z13 -r1 --drop-densest-as-needed --maximum-tile-bytes=2500000 --force \
            /tmp/treks.geojsonseq
          ls -lh public/treks.pmtiles

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treks
          path: public/treks.pmtiles
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treks
          path: public
      - name: Commit si changé
        run: |
          git config user.name "Bist0uille"
          git config user.email "111542828+Bist0uille@users.noreply.github.com"
          git add public/treks.pmtiles
          if git diff --cached --quiet; then
            echo "treks.pmtiles inchangé."
          else
            git commit -m "chore(data): build PMTiles Geotrek (treks)"
            git pull --rebase origin main
            git push
          fi
