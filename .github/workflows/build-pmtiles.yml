# Construit pois.pmtiles + routes.pmtiles (FR + ES + IT) et les envoie sur
# Cloudflare R2 (trop gros pour le repo à 3 pays → > 100 Mo).
name: Construire PMTiles POI + Itinéraires (R2)

on:
  schedule:
    # Le 1er de chaque mois à 03:00 UTC (fichiers volumineux → mensuel)
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Installer osmium + gdal + tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git init /tmp/tippecanoe
          git -C /tmp/tippecanoe remote add origin https://github.com/felt/tippecanoe.git
          git -C /tmp/tippecanoe fetch --depth 1 origin 4f2621186acfec33b63ddf636f665623c0fef2dd
          git -C /tmp/tippecanoe checkout --detach FETCH_HEAD
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Construire les PMTiles (télécharge FR+ES+IT, filtre, build)
        run: bash scripts/process-osm.sh "france spain italy"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tiles
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/pois.pmtiles
            /tmp/routes.pmtiles
      - name: Rapport de fusion des auberges (sources, ajouts, cas ambigus)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hostel-merge-report
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/hostel-merge-report.json
            /tmp/datatourisme-place.csv.metadata.json

  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tiles
          path: /tmp
      - name: Envoyer sur Cloudflare R2 (si secrets présents)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "Secrets R2 absents → upload sauté (mesure de taille seule)."
            exit 0
          fi
          aws --version # AWS CLI supplied by the GitHub-hosted runner
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          for f in pois routes; do
            aws s3 cp "/tmp/$f.pmtiles" "s3://$R2_BUCKET/$f.pmtiles" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/octet-stream
            echo "✅ $f.pmtiles envoyé sur R2."
          done
