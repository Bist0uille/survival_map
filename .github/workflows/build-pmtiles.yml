# Construit pois.pmtiles + routes.pmtiles (FR + ES + IT) et les envoie sur
# Cloudflare R2 (trop gros pour le repo à 3 pays → > 100 Mo).
name: Construire PMTiles POI + Itinéraires (R2)

on:
  schedule:
    # Chaque lundi à 03:17 UTC : même pipeline, aucune source supplémentaire.
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

concurrency:
  group: build-pmtiles
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Installer osmium + gdal + tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 osmium-tool gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git init /tmp/tippecanoe
          git -C /tmp/tippecanoe remote add origin https://github.com/felt/tippecanoe.git
          git -C /tmp/tippecanoe fetch --depth 1 origin 4f2621186acfec33b63ddf636f665623c0fef2dd
          git -C /tmp/tippecanoe checkout --detach FETCH_HEAD
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Construire les PMTiles (télécharge FR+ES+IT, filtre, build)
        run: bash scripts/process-osm.sh "france spain italy"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiles
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/pois.pmtiles
            /tmp/routes.pmtiles
            /tmp/bakery-status.json
      - name: Rapport de fusion des auberges (sources, ajouts, cas ambigus)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostel-merge-report
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/hostel-merge-report.json
            /tmp/datatourisme-place.csv.metadata.json

  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tiles
          path: /tmp
      - name: Envoyer sur Cloudflare R2 (si secrets présents)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!key}" ]; then echo "::error::Configuration R2 incomplète : $key"; exit 1; fi
          done
          previous=$(curl --silent --show-error --location --retry 3 --max-time 45 \
            -H 'Cache-Control: no-cache' -o /tmp/previous-bakery-status.json -w '%{http_code}' \
            "https://pub-1cff175e1c4641718e16b36f04ea91b1.r2.dev/bakery-status.json?run=$GITHUB_RUN_ID")
          if [ "$previous" = 200 ]; then
            node scripts/bakery-report.mjs check /tmp/bakery-status.json /tmp/previous-bakery-status.json
          elif [ "$previous" = 404 ]; then
            node scripts/bakery-report.mjs check /tmp/bakery-status.json
          else
            echo "::error::Impossible de contrôler la précédente base ($previous) : publication bloquée."
            exit 1
          fi
          aws --version # AWS CLI supplied by the GitHub-hosted runner
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          for f in pois routes; do
            aws s3 cp "/tmp/$f.pmtiles" "s3://$R2_BUCKET/$f.pmtiles" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/octet-stream --cache-control 'public, max-age=3600'
            echo "✅ $f.pmtiles envoyé sur R2."
          done
          # The successful-publication report is written last; a failed import
          # never claims a new success. Workflow failures remain visible in admin.
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "/tmp/bakery-status.json";
            const report = JSON.parse(readFileSync(path, "utf8"));
            report.publishedAt = new Date().toISOString();
            writeFileSync(path, JSON.stringify(report));
          '
          aws s3 cp /tmp/bakery-status.json "s3://$R2_BUCKET/bakery-status.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control 'no-cache'
          echo '### Boulangeries publiées (FR/ES/IT)' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bakery-status.json >> "$GITHUB_STEP_SUMMARY"
