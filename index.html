<!doctype html>

    <link rel="canonical" href="https://survimap.com/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://survimap.com/" />
    <meta property="og:site_name" content="Survimap" />
    <meta property="og:title" content="Survimap — Fontaines, ravitaillement vélo et randonnée" />
    <meta
      property="og:description"
      content="Fontaines en ville, boulangeries à vélo, eau et refuges en randonnée : préparez vos arrêts avec une carte gratuite, sans compte."
    />
    <meta property="og:image" content="https://survimap.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Survimap — Fontaines, ravitaillement vélo et randonnée" />

      name="twitter:description"
      content="Fontaines en ville, boulangeries à vélo, eau et refuges en randonnée : préparez vos arrêts avec une carte gratuite, sans compte."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Survimap",
        "alternateName": "Survival Map",
        "url": "https://survimap.com/",
        "description": "Carte gratuite pour repérer fontaines, points d’eau, commerces de ravitaillement, refuges et sentiers en ville, à vélo ou en randonnée. France, Espagne, Italie. Consultation hors ligne après téléchargement des données.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "inLanguage": "fr",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Survimap",
        "alternateName": "Survival Map",
        "url": "https://survimap.com/",
        "inLanguage": "fr"
      }
    </script>
    <!-- CSS critique inline : garantit la hauteur AVANT le bundle CSS,
         sinon MapLibre s'initialise dans un conteneur de hauteur 0. -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>

  <body>
    <div id="root"></div>
    <noscript>
      <p>
        <strong>Survimap</strong> — carte gratuite pour trouver fontaines, boulangeries,

        <a href="/randonnee-bivouac/">randonnée et bivouac</a>.

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
